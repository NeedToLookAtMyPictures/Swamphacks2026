<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User App</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="tabs">
    <button class="tab active" data-tab="messages">Messages</button>
    <button class="tab" data-tab="map">Map</button>
    <button class="tab" data-tab="debug">Debug</button>
  </nav>

  <main>
    <section id="messages" class="panel active">
      <aside id="chat-sidebar">
        <form id="new-chat">
          <select id="new-chat-to" required></select>
          <input id="new-chat-name" list="contact-list" placeholder="Type a name"
                 pattern="[A-Za-z0-9_\-]{1,32}" autocomplete="off" hidden>
          <datalist id="contact-list"></datalist>
          <button id="new-chat-go" hidden>Start</button>
        </form>
        <div id="chat-list"></div>
      </aside>
      <div id="chat-view">
        <div id="chat-title"></div>
        <div id="message-list"></div>
        <form id="compose">
          <textarea id="compose-content" placeholder="Message" rows="2" required></textarea>
          <div class="compose-row">
            <span id="compose-status"></span>
            <button>Send</button>
          </div>
        </form>
      </div>
    </section>

    <section id="map" class="panel">
      {% if not map_info.name %}
      <div class="notice">No offline map downloaded. Run <code>python download_locales.py map</code>.</div>
      {% endif %}
      <div id="leaflet-map"></div>
      <div id="map-settings">
        <button id="map-settings-toggle" type="button" title="Map settings" aria-label="Map settings">&#9881;</button>
        <div id="map-settings-panel" hidden>
          <div class="settings-view" data-view="menu">
            <div class="settings-title">Settings</div>
            <button class="settings-item" type="button" data-open="last-known">Last known location <span>&rsaquo;</span></button>
          </div>
          <div class="settings-view" data-view="last-known" hidden>
            <div class="settings-header">
              <button class="settings-back" type="button" data-open="menu" aria-label="Back">&lsaquo;</button>
              <span class="settings-title">Last known location</span>
            </div>
            <input id="last-known-search" type="search" placeholder="Search people" autocomplete="off">
            <div id="last-known-list"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="debug" class="panel">
      <div class="debug-toolbar">
        <strong>Local database</strong>
        <button id="debug-refresh">Refresh</button>
        <span id="debug-status"></span>
      </div>
      <div id="debug-content"></div>
    </section>
  </main>

  <script>window.MAP_INFO = {{ map_info | tojson }};</script>
  <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='vendor/protomaps-leaflet/protomaps-leaflet.js') }}"></script>
  <script src="{{ url_for('static', filename='messages.js') }}"></script>
  <script src="{{ url_for('static', filename='debug.js') }}"></script>
  <script src="{{ url_for('static', filename='map-settings.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
