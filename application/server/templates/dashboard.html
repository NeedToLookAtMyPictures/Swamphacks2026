<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Database</title>
  <style>
    :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d9d9de; --head: #f3f3f6; --dead: #999; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161618; --fg: #ececf0; --muted: #9a9aa2; --line: #34343a; --head: #222226; --dead: #6c6c72; }
    }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
           font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .meta, .empty { color: var(--muted); margin: 0; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
    .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left;
             white-space: nowrap; vertical-align: top; }
    td.long { white-space: normal; min-width: 16em; }
    th { background: var(--head); position: sticky; top: 0; }
    tr.dead td { color: var(--dead); }
  </style>
</head>
<body>
  <h1>Server database</h1>
  <p class="meta">server_id <b>{{ server_id }}</b> · {{ db_path }}</p>
  <div class="toolbar">
    <button id="refresh">Refresh</button>
    <label><input type="checkbox" id="auto" checked> Refresh every 5 s</label>
    <span id="status" class="meta"></span>
  </div>
  <div id="tables"></div>

  <script>
    const TABLES = {{ tables | tojson }};
    const API = {{ (request.script_root ~ '/api') | tojson }};  // includes /server when opened through it
    const TIME_FIELDS = new Set(["time_created", "time_received", "last_sync"]);
    const LONG_FIELDS = new Set(["content", "comment", "description"]);

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;  // textContent, so data can't inject HTML
      if (className) node.className = className;
      return node;
    }

    function format(key, value) {
      if (value === null || value === undefined) return "—";
      if (TIME_FIELDS.has(key) && typeof value === "number") {
        return new Date(value * 1000).toLocaleString();
      }
      return String(value);
    }

    function render(name, rows) {
      const section = el("section");
      section.appendChild(el("h2", `${name} (${rows.length})`));
      if (rows.length === 0) {
        section.appendChild(el("p", "empty", "empty"));
        return section;
      }
      // Newest first: that's what changes while the server runs
      rows = rows.slice().sort((a, b) => (b.time_created || 0) - (a.time_created || 0));
      const columns = Object.keys(rows[0]);
      const table = el("table");
      const head = table.createTHead().insertRow();
      columns.forEach((c) => head.appendChild(el("th", c)));
      const body = table.createTBody();
      rows.forEach((row) => {
        const tr = body.insertRow();
        if (row.is_dead) tr.className = "dead";
        columns.forEach((c) => {
          const td = tr.insertCell();
          td.textContent = format(c, row[c]);
          if (LONG_FIELDS.has(c)) td.className = "long";
        });
      });
      const wrap = el("div", undefined, "wrap");
      wrap.appendChild(table);
      section.appendChild(wrap);
      return section;
    }

    async function load() {
      const status = document.getElementById("status");
      try {
        const data = await Promise.all(TABLES.map(
          (t) => fetch(`${API}/${t}`).then((r) => r.json())));
        document.getElementById("tables").replaceChildren(
          ...TABLES.map((t, i) => render(t, data[i])));
        status.textContent = `Updated ${new Date().toLocaleTimeString()}`;
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    document.getElementById("refresh").addEventListener("click", load);
    setInterval(() => {
      if (document.getElementById("auto").checked && !document.hidden) load();
    }, 5000);
    load();
  </script>
</body>
</html>
